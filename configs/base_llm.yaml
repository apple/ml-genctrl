initial_states:
  input_prompt: Imagine you are a user about to ask a question to a chatbot. Say your opening greeting and only the greeting.
  sampling_config:
    temperature: 0.9
    top_p: 0.95
    do_sample: true
    return_full_text: false
output_dir: ${oc.env:OUTPUT_DIR, /tmp/genctrl}
output_file: null
model_cache: ${oc.env:DATA_DIR, /tmp/genctrl}
time_steps: 5  # Required, time horizon T

model_config:   # Optional dict config for sampling, can be overridden on command line
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  max_new_tokens: 100
  do_sample: false
  batch_size: 64

reachability_params:
  confidence: 0.05  # Optional, default is 0.05
  p_min: 0.05  # Mandatory, default is 0.05
  gamma: 0.1

controllability_params:
  partially_controllable: 0.1  # Optional, default is 0.1
  confidence: 0.05  # Optional, default is 0.05
  error: 0.05  # Optional, default is 0.05

wandb:
  project: genctrl
  group: null
  dir: ${oc.env:DATA_DIR, /tmp/cache}
  entity: null
  mode: disabled # options: offline, online, disabled
